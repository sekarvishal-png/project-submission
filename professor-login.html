<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professor Login | ProjectTrack</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7280;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --border: #d7dce6;
      --error: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--accent); color: #fff;
      display: grid; place-items: center; font-size: 14px;
    }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: #f1e9ff;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 16px;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .row label { font-weight: 400; margin: 0; display: flex; gap: 6px; align-items: center; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      color: var(--error);
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .switch {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
    footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      padding: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">SV</div>
    <span>ProjectTrack</span>
  </header>

  <main>
    <section class="card">
      <span class="badge">Faculty Portal</span>
      <h1>Professor Login</h1>
      <p class="subtitle">SRM Valliammai Engineering College</p>

      <p class="error" id="error" role="alert"></p>

      <form id="loginForm" novalidate>
        <label for="email">Institutional Email</label>
        <input type="email" id="email" name="email" placeholder="name@srmvalliammai.edu.in" autocomplete="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />

        <div class="row">
          <label><input type="checkbox" name="remember" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" id="submitBtn">Log In</button>
      </form>

      <p class="switch">
        Are you a student? <a href="student-login.html">Student login</a>
      </p>
      <p class="switch">
        New here? <a href="signup.html">Create an account</a>
      </p>
      <p class="switch">
        <a href="index.html">← Back to home</a>
      </p>
    </section>
  </main>

  <footer>© 2026 ProjectTrack. Deployed for SRM Valliammai Engineering College.</footer>

  <script>
    const form = document.getElementById("loginForm");
    const errorEl = document.getElementById("error");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";

      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        errorEl.textContent = "Please enter your email and password.";
        errorEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        // TODO: Replace this endpoint with your real professor login API.
        const res = await fetch("/api/auth/professor/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        if (!res.ok) throw new Error("Invalid credentials");

        window.location.href = "/professor/dashboard";
      } catch (err) {
        errorEl.textContent = "Invalid email or password.";
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
